name: iOS Unsigned Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    env:
      RCT_USE_PREBUILT_RNCORE: "0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Prebuild iOS
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Patch Podfile to disable signing
        working-directory: mobile
        run: node scripts/patch-podfile.js

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build Xcode Workspace (Unsigned)
        working-directory: mobile
        run: |
          xcodebuild \
            -workspace ios/mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package IPA
        working-directory: mobile
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/mobile.app build/Payload
          cd build
          zip -r ../mobile.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-ipa
          path: mobile/mobile.ipa
          retention-days: 7
